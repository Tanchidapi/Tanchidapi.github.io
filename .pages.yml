media:
  input: imgs
  output: /imgs

content:
  - name: posts
    label: 文章
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename: '{year}-{month}-{day}-{primary}.md'
    subfolders: true
    view:
      fields: [title, date, categories]
      primary: title
      sort: date
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: date
        label: 日期
        type: date
        required: true
        options:
          format: yyyy-MM-dd HH:mm:ss Z
      - name: categories
        label: 分类
        type: string
        list: true
        required: true
      - name: tags
        label: 标签
        type: string
        list: true
      - name: permalink
        label: 永久链接
        type: string
        description: 请输入唯一路径，例如 /posts/算法/二分查找/
      - name: body
        label: 正文
        type: rich-text
